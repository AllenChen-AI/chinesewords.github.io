<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>符文戰士：街機對決 (原地切換完美版)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes bossFloat {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-10px) scale(1.02); }
    }
    @keyframes bossHurtAnim {
      0% { transform: scale(1.2) translate(-8px, 6px); filter: brightness(2.5) drop-shadow(0 0 35px #ef4444); }
      30% { transform: scale(0.9) translate(8px, -4px); filter: brightness(1.8) drop-shadow(0 0 25px #f59e0b); }
      100% { transform: scale(1) translate(0, 0); filter: drop-shadow(0 0 15px rgba(239, 68, 68, 0.4)); }
    }
    @keyframes bossShieldAnim {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px #38bdf8); }
      50% { transform: scale(1.08); filter: drop-shadow(0 0 35px #38bdf8); }
    }
    @keyframes runeGlow {
      0%, 100% { box-shadow: 0 0 15px rgba(245, 158, 11, 0.2), inset 0 0 15px rgba(245, 158, 11, 0.1); }
      50% { box-shadow: 0 0 30px rgba(245, 158, 11, 0.5), inset 0 0 25px rgba(245, 158, 11, 0.2); }
    }
    @keyframes damagePop {
      0% { transform: translate(-50%, 0) scale(0.5); opacity: 0; }
      20% { transform: translate(-50%, -25px) scale(1.4); opacity: 1; }
      80% { transform: translate(-50%, -55px) scale(1.1); opacity: 1; }
      100% { transform: translate(-50%, -75px) scale(0.8); opacity: 0; }
    }
    @keyframes slashAnim {
      0% { opacity: 1; transform: translate(-50%, -50%) rotate(var(--rot)) scaleX(0.1) scaleY(2); }
      40% { opacity: 1; transform: translate(-50%, -50%) rotate(var(--rot)) scaleX(1.3) scaleY(1); }
      100% { opacity: 0; transform: translate(-50%, -50%) rotate(var(--rot)) scaleX(1.6) scaleY(0.2); }
    }

    .boss-idle { animation: bossFloat 3.5s ease-in-out infinite; }
    .boss-hurt { animation: bossHurtAnim 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97) both; }
    .boss-shield { animation: bossShieldAnim 0.5s ease-in-out 2; }
    .rune-box-glow { animation: runeGlow 2.5s infinite; }
    .damage-fly { animation: damagePop 0.85s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards; }
    .slash-effect { animation: slashAnim 0.35s ease-out forwards; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans select-none overflow-x-hidden relative">

  <!-- 背景動態網格與氛圍光暈 -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
    <div class="absolute -top-32 left-1/2 -translate-x-1/2 w-[550px] h-[550px] bg-red-600/15 rounded-full blur-[120px]"></div>
    <div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-[600px] h-[350px] bg-amber-500/10 rounded-full blur-[140px]"></div>
    <div class="absolute inset-0 bg-[linear-gradient(to_right,#1e293b15_1px,transparent_1px),linear-gradient(to_bottom,#1e293b15_1px,transparent_1px)] bg-[size:28px_28px]"></div>

        <option value="U09">第 31~45 題：日子 ～ 充電 (15詞)</option>
        <option value="U10">第 46~60 題：臉盆 ～ 不熟 (15詞)</option>

        <option value="U12">第 76~92 題：袖子 ～ 計謀 (17詞)</option>

  <!-- 主戰鬥核心區 -->
  <main class="relative z-10 flex-1 flex flex-col max-w-lg w-full mx-auto p-4 gap-3.5">
    
    <!-- 競技場卡片 -->
    <div id="battle-arena" class="relative bg-gradient-to-b from-slate-900/90 via-slate-900/60 to-slate-950/90 border-2 border-slate-800/80 rounded-3xl p-4 shadow-[0_20px_50px_rgba(0,0,0,0.8)] backdrop-blur-xl flex flex-col items-center overflow-hidden">

    <!-- 整合型互動面板（原地切換，免滾動） -->
    <div class="rune-box-glow bg-gradient-to-b from-slate-900 to-slate-950 border border-amber-500/40 rounded-2xl p-4 shadow-xl flex flex-col gap-3 transition-all duration-300">
      <div class="flex items-center justify-between">

        </div>

        <button id="btn-reveal-answer" class="w-full mt-1 py-3.5 bg-gradient-to-r from-amber-500 via-orange-500 to-red-500 hover:from-amber-400 hover:to-red-400 active:scale-[0.98] text-slate-950 font-black text-sm rounded-xl shadow-[0_0_20px_rgba(245,158,11,0.4)] transition-all flex items-center justify-center gap-2 group">

        <!-- 動態米字格展示 -->

        <div class="text-xs text-slate-300 bg-slate-900/90 rounded-xl p-2.5 border border-slate-800 leading-relaxed">

            <span class="text-sm">⚔️</span>

          <button id="btn-judge-crit" class="py-2.5 bg-gradient-to-b from-amber-400 via-orange-500 to-red-600 hover:from-amber-300 hover:to-red-500 text-slate-950 font-black text-xs rounded-xl active:scale-95 transition-all flex flex-col items-center justify-center gap-0.5 shadow-[0_0_15px_rgba(245,158,11,0.6)]">

  <script>
    /* 1. 音效引擎 */
    class SoundEngine {
      constructor() { this.ctx = null; }
      init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
      playSlash() {
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(600, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + 0.12);
      }
      playHit(isCrit = false) {
        this.init();
        this.playSlash();
        setTimeout(() => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = isCrit ? 'square' : 'triangle';
          osc.frequency.setValueAtTime(isCrit ? 180 : 130, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + (isCrit ? 0.4 : 0.25));
          gain.gain.setValueAtTime(isCrit ? 0.7 : 0.45, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + (isCrit ? 0.4 : 0.25));
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.start(); osc.stop(this.ctx.currentTime + (isCrit ? 0.4 : 0.25));
        }, 50);
      }
      playShield() {
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(380, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(150, this.ctx.currentTime + 0.25);
        gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + 0.25);
      }
      playVictory() {
        this.init();
        const chord = [261.63, 329.63, 392.00, 523.25, 659.25];
        chord.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.2, this.ctx.currentTime + idx * 0.09);
          gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + idx * 0.09 + 0.35);
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.start(this.ctx.currentTime + idx * 0.09);
          osc.stop(this.ctx.currentTime + idx * 0.09 + 0.35);
        });
      }
    }
    const audio = new SoundEngine();

    /* 2. 粒子特效引擎 */
    const fxCanvas = document.getElementById("fx-canvas");
    const fxCtx = fxCanvas.getContext("2d");
    let particles = [];
    function resizeFx() { fxCanvas.width = window.innerWidth; fxCanvas.height = window.innerHeight; }
    window.addEventListener("resize", resizeFx);
    resizeFx();

    class Particle {
      constructor(x, y, isCrit) {
        this.x = x; this.y = y;
        const angle = Math.random() * Math.PI * 2;
        const speed = isCrit ? (Math.random() * 9 + 4) : (Math.random() * 6 + 2);
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.size = isCrit ? (Math.random() * 6 + 3) : (Math.random() * 4 + 2);
        this.alpha = 1;
        this.decay = Math.random() * 0.03 + 0.02;
        this.color = isCrit ? ["#fbbf24", "#f59e0b", "#ef4444", "#ffffff"][Math.floor(Math.random()*4)] : ["#38bdf8", "#818cf8", "#e0e7ff"][Math.floor(Math.random()*3)];
      }
      update() { this.x += this.vx; this.y += this.vy; this.vy += 0.15; this.alpha -= this.decay; }
      draw(ctx) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 8;
        ctx.shadowColor = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }
    function spawnParticles(x, y, count = 35, isCrit = false) {
      for (let i = 0; i < count; i++) particles.push(new Particle(x, y, isCrit));
    }
    function animateParticles() {
      fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
      particles = particles.filter(p => p.alpha > 0);
      particles.forEach(p => { p.update(); p.draw(fxCtx); });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    /* 3. 199 詞題庫完整定義 */
    const UNITS = {
      // =====【考卷一：共 90 題】=====
      "U01": {
        bossName: "機械古鐘魔獸", maxHp: 750, fallbackIcon: "⏰",
        sprites: { idle: "assets/clock_idle.png", hurt: "assets/clock_idle.png", shield: "assets/clock_idle.png" },
        words: [
          { text: "交通", zhuyin: "ㄐㄧㄠ ㄊㄨㄥ", clue: "馬路上人車往來的運行往來。", tip: "「交」六字頭；「通」辵部加甬。" },
          { text: "容易", zhuyin: "ㄖㄨㄥˊ ㄧˋ", clue: "做起來很輕鬆、一點都不困難。", tip: "「容」是穴部；「易」上日下勿，小心別多加點！" },
          { text: "漂亮", zhuyin: "ㄆㄧㄠˋ ㄌㄧㄤˋ", clue: "外觀精緻美麗，讓人看了心情很好。", tip: "「漂」三點水加票；「亮」高字頭（亠口），下為儿。" },
          { text: "清楚", zhuyin: "ㄑㄧㄥ ㄔㄨˇ", clue: "看得明白、聽得透徹，毫無疑惑。", tip: "「清」三點水；「楚」雙木林下為疋。" },
          { text: "作業", zhuyin: "ㄗㄨㄛˋ ㄧㄝˋ", clue: "放學後必須在書桌前完成的課業任務。", tip: "「作」人字旁；「業」注意對稱橫劃與豎筆順序。" },
          { text: "標準", zhuyin: "ㄅㄧㄠ ㄓㄨㄣˇ", clue: "衡量事物好壞的公認尺度與規範。", tip: "「標」木字旁加票；「準」左邊是兩點水。" },
          { text: "停止", zhuyin: "ㄊㄧㄥˊ ㄓˇ", clue: "不再繼續動作、原地靜止不動。", tip: "「停」人字旁；「止」最後一橫平穩封口。" },
          { text: "提醒", zhuyin: "ㄊㄧˊ ㄒㄧㄥˇ", clue: "告訴別人需要注意的事，避免忘記。", tip: "「提」右為是；「醒」左邊酉字旁不能漏橫！" },
          { text: "排列", zhuyin: "ㄆㄞˊ ㄌㄧㄝˋ", clue: "把散亂的東西按照規律一個接一個排好。", tip: "「排」提手旁；「列」左歹右刀。" },
          { text: "公車", zhuyin: "ㄍㄨㄥ ㄔㄜ", clue: "路上載著許多乘客的大型客運車。", tip: "「公」上面是八不是人；「車」注意橫豎穿插順序。" },
          { text: "還要", zhuyin: "ㄏㄞˊ ㄧㄠˋ", clue: "除了眼前的東西之外，額外還需要更多。", tip: "「還」辵部加睘，筆劃繁多寫清楚；「要」上西下女。" },

          { text: "驚訝", zhuyin: "ㄐㄧㄥ ㄧㄚˋ", clue: "事情超出預料讓人嘴巴張大感到驚奇意外。", tip: "「驚」敬加馬；" },
          { text: "怎麼辦", zhuyin: "ㄗㄣˇ ˙ㄇㄜ ㄅㄢˋ", clue: "突發狀況不知道該如何應對的著急問句。", tip: "「辦」辛加力；" },
          { text: "案件", zhuyin: "ㄢˋ ㄐㄧㄢˋ", clue: "偵探或警察負責追查調查的神秘事件。", tip: "「案」安加木；" },
          { text: "華麗", zhuyin: "ㄏㄨㄚˊ ㄌㄧˋ", clue: "宮殿舞台裝飾得金碧輝煌極度亮眼奪目。", tip: "「華」草字頭；" },
          { text: "設備", zhuyin: "ㄕㄜˋ ㄅㄟˋ", clue: "大型工廠或教室裡安裝的專業硬體器材。", tip: "「設」言加殳；" },
          { text: "驚喜", zhuyin: "ㄐㄧㄥ ㄒㄧˇ", clue: "出乎意料突然收到禮物帶來的狂喜感動。", tip: "「驚」敬加馬；" },
          { text: "老鼠", zhuyin: "ㄌㄠˇ ㄕㄨˇ", clue: "長著長長尾巴、動作鬼鬼祟祟的齧齒動物。", tip: "「老」土丿匕；" },
          { text: "霓虹燈", zhuyin: "ㄋㄧˊ ㄏㄨㄥˊ ㄉㄥ", clue: "夜晚街頭大廈閃爍耀眼的五彩繽紛廣告燈管。", tip: "「霓」雨加兒；" },
          { text: "失敗", zhuyin: "ㄕ ㄅㄞˋ", clue: "挑戰沒有成功，但能從中吸取經驗重新再來。", tip: "「敗」貝字旁；" },
          { text: "美麗", zhuyin: "ㄇㄟˇ ㄌㄧˋ", clue: "姿態容貌宛如仙境般動人漂亮好看。", tip: "「美」羊大為美。" },
          { text: "跳舞", zhuyin: "ㄊㄧㄠˋ ㄨˇ", clue: "隨著輕快的旋律高興地踩著拍子擺動身軀。", tip: "「跳」足加兆；" },
          { text: "思念", zhuyin: "ㄙ ㄋㄧㄢˋ", clue: "心裡深深牽掛思念遠方的親人朋友。", tip: "「思」田加心。" }
        ]
      }
    };

    let curUnitKey = "U01";
    let wordIdx = 0;
    let bossHp = 750;

    const bossImgEl = document.getElementById("boss-sprite");
    const fallbackEl = document.getElementById("boss-fallback");

    function setBossSprite(state = "idle") {
      const u = UNITS[curUnitKey];
      const src = u.sprites[state] || u.sprites.idle;
      bossImgEl.onerror = () => {
        bossImgEl.classList.add("hidden");
        fallbackEl.classList.remove("hidden");
        fallbackEl.textContent = u.fallbackIcon;
      };
      bossImgEl.onload = () => {
        bossImgEl.classList.remove("hidden");
        fallbackEl.classList.add("hidden");
      };
      bossImgEl.src = src;
    }

    function renderQuest() {
      const u = UNITS[curUnitKey];
      const cur = u.words[wordIdx];
      document.getElementById("quest-stage").textContent = `${wordIdx + 1} / ${u.words.length} 詞`;
      document.getElementById("target-zhuyin").textContent = cur.zhuyin;
      document.getElementById("target-clue").textContent = cur.clue;
      document.getElementById("target-tip").textContent = cur.tip;

      // 動態渲染米字格
      const charBox = document.getElementById("char-display-box");
      charBox.innerHTML = "";
      for (const ch of cur.text) {
        const box = document.createElement("div");
        box.className = "w-14 h-14 sm:w-16 sm:h-16 rounded-xl bg-slate-900/90 border-2 border-amber-400/40 flex items-center justify-center relative shadow-[0_0_15px_rgba(245,158,11,0.15)]";
        box.innerHTML = `
          <div class="absolute inset-0 pointer-events-none flex items-center"><div class="w-full border-b border-red-500/20 border-dashed"></div></div>
          <div class="absolute inset-0 pointer-events-none flex justify-center"><div class="h-full border-r border-red-500/20 border-dashed"></div></div>
          <span class="text-3xl sm:text-4xl font-serif font-black text-amber-300 filter drop-shadow-[0_2px_8px_rgba(245,158,11,0.5)]">${ch}</span>
        `;
        charBox.appendChild(box);
      }

      // 重置回學生寫字狀態（原地切換）
      document.getElementById("state-question").classList.remove("hidden");
      document.getElementById("state-review").classList.add("hidden");
      document.getElementById("panel-title").textContent = "RUNE QUEST";
    }

    function triggerArcadeStrike(damage, isCrit) {
      const u = UNITS[curUnitKey];
      const bossBox = document.getElementById("boss-container");
      const slashBox = document.getElementById("slash-container");
      const damageText = document.getElementById("damage-text");
      const curWord = u.words[wordIdx];

      const slash = document.createElement("div");
      const deg = isCrit ? "-35deg" : "40deg";
      slash.style.setProperty("--rot", deg);
      slash.className = `slash-effect absolute left-1/2 top-1/2 w-64 h-3 -translate-x-1/2 -translate-y-1/2 ${isCrit ? 'bg-gradient-to-r from-yellow-300 via-amber-400 to-red-500 shadow-[0_0_20px_#f59e0b]' : 'bg-gradient-to-r from-sky-300 via-cyan-400 to-blue-500 shadow-[0_0_15px_#38bdf8]'} rounded-full z-20 pointer-events-none`;
      slashBox.appendChild(slash);
      setTimeout(() => slash.remove(), 400);

      const rect = bossBox.getBoundingClientRect();
      spawnParticles(rect.left + rect.width / 2, rect.top + rect.height / 2, isCrit ? 60 : 30, isCrit);

      setBossSprite("hurt");
      bossBox.classList.remove("boss-idle", "boss-hurt", "boss-shield");
      void bossBox.offsetWidth;
      bossBox.classList.add("boss-hurt");
      audio.playHit(isCrit);

      damageText.textContent = isCrit ? `CRITICAL -${damage}!!` : `-${damage}`;
      damageText.className = `damage-fly absolute left-1/2 top-1/2 font-black italic text-3xl sm:text-4xl pointer-events-none z-30 font-mono tracking-wider ${isCrit ? 'text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-amber-400 to-red-500 drop-shadow-[0_4px_12px_rgba(245,158,11,0.9)]' : 'text-sky-300 drop-shadow-[0_4px_10px_rgba(56,189,248,0.8)]'}`;

      bossHp = Math.max(0, bossHp - damage);
      const pct = Math.floor((bossHp / u.maxHp) * 100);
      document.getElementById("boss-hp-current").textContent = bossHp;
      document.getElementById("boss-hp-bar").style.width = `${pct}%`;
      setTimeout(() => {
        document.getElementById("boss-hp-ghost").style.width = `${pct}%`;
      }, 250);

      document.getElementById("battle-log").innerHTML = isCrit 
        ? `<span class="text-amber-400 font-black text-sm">💥【${curWord.text}】字跡極度工整！暴擊重創魔王 -${damage} HP！</span>`
        : `<span class="text-sky-400 font-bold">⚔️ 符文命中！成功召喚【${curWord.text}】造成 -${damage} 傷害！</span>`;

      setTimeout(() => {
        setBossSprite("idle");
        bossBox.classList.remove("boss-hurt");
        bossBox.classList.add("boss-idle");
      }, 600);

      if (bossHp <= 0) {
        setTimeout(() => {
          audio.playVictory();
          fallbackEl.classList.remove("hidden");
          fallbackEl.textContent = "💥";
          bossImgEl.classList.add("hidden");
          document.getElementById("battle-log").innerHTML = `<span class="text-amber-300 font-black text-base tracking-wider">👑 VICTORY！全數擊破！魔王徹底瓦解！</span>`;
        }, 500);
      } else {
        wordIdx = (wordIdx + 1) % u.words.length;
        setTimeout(renderQuest, 1000);
      }
    }

    function triggerShieldBlock() {
      const bossBox = document.getElementById("boss-container");
      setBossSprite("shield");
      bossBox.classList.remove("boss-idle", "boss-hurt", "boss-shield");
      void bossBox.offsetWidth;
      bossBox.classList.add("boss-shield");
      audio.playShield();

      const damageText = document.getElementById("damage-text");
      damageText.textContent = `BLOCK! 0`;
      damageText.className = `damage-fly absolute left-1/2 top-1/2 font-black italic text-2xl text-slate-400 pointer-events-none z-30 font-mono tracking-wider drop-shadow-[0_2px_8px_rgba(148,163,184,0.8)]`;

      document.getElementById("battle-log").innerHTML = `<span class="text-rose-400 font-bold">🛡️ 筆劃有小瑕疵，魔王舉盾防禦！請對照螢幕上的紅格，在紙上重新修整！</span>`;

      setTimeout(() => {
        setBossSprite("idle");
        bossBox.classList.remove("boss-shield");
        bossBox.classList.add("boss-idle");
      }, 700);
    }

    // 點擊核對：原地切換成審查面板
    document.getElementById("btn-reveal-answer").addEventListener("click", () => {
      document.getElementById("state-question").classList.add("hidden");
      document.getElementById("state-review").classList.remove("hidden");
      document.getElementById("panel-title").textContent = "TEACHER JUDGE";
      document.getElementById("battle-log").innerHTML = `請老師核對紙上的字形與筆劃結構！`;
    });

    document.getElementById("btn-judge-fail").addEventListener("click", triggerShieldBlock);
    document.getElementById("btn-judge-pass").addEventListener("click", () => triggerArcadeStrike(50, false));
    document.getElementById("btn-judge-crit").addEventListener("click", () => triggerArcadeStrike(80, true));

    // 下拉選單切換關卡
    document.getElementById("unit-selector").addEventListener("change", (e) => {
      curUnitKey = e.target.value;
      const u = UNITS[curUnitKey];
      wordIdx = 0;
      bossHp = u.maxHp;
      document.getElementById("boss-name").textContent = u.bossName;
      document.getElementById("boss-hp-current").textContent = bossHp;
      document.getElementById("boss-hp-max").textContent = u.maxHp;
      document.getElementById("boss-hp-bar").style.width = "100%";
      document.getElementById("boss-hp-ghost").style.width = "100%";
      setBossSprite("idle");
      renderQuest();
    });

    // 初始化載入
    setBossSprite("idle");
    renderQuest();
  </script>
</body>
</html>
